# Continuous integration for Interference (master spec section 11: CI builds, tests and packages the
# artifacts, checks licence notices, signs only with configured credentials and never fakes a signature).
#
# Jobs
#   checks    (ubuntu, every push / PR): licence notices + Docs/Parameters.md is up to date with Params.h
#   build     (windows, every push / PR): configure, build Release, run the DSP and GUI test suites, then an
#             UNSIGNED release ZIP + SHA-256 and the built binaries uploaded as artifacts
#   release   (windows, v* tags only, protected environment "release"): signs the binaries from `build` with the
#             release certificate (when configured), writes SIGNATURE.txt via make_release.ps1, uploads the ZIP
#   build-unix (linux + macOS, every push / PR): native build, both test suites, archive + SHA-256
#   publish   (v* tags only): one GitHub Release with the Windows, Linux and macOS archives
#   slow      (windows, manual "Run workflow" only): the slow suite (CPU benchmark + 1 h offline soak)
#
# Runner images are pinned (windows-2022 ships Visual Studio 2022, which the generator below names); bump deliberately.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the slow tests (CPU benchmark + 1 h offline soak)"
        type: boolean
        default: true
      release_tag:
        description: "Publish a GitHub Release with this tag (e.g. v1.1.0-beta.1) from the selected commit; empty = no release"
        type: string
        default: ""

permissions:
  contents: read

env:
  JUCE_TAG: "8.0.8"

jobs:
  checks:
    name: Licence notices and parameter docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Licence notices are present
        shell: bash
        run: |
          set -e
          for f in LICENSE THIRD_PARTY.md; do
            [ -f "$f" ] || { echo "::error::$f is missing"; exit 1; }
          done
          # every statically linked third-party component must be named (JUCE bundles HarfBuzz and SheenBidi)
          for word in JUCE VST3 HarfBuzz SheenBidi; do
            grep -q "$word" THIRD_PARTY.md || { echo "::error::THIRD_PARTY.md does not mention $word"; exit 1; }
          done
          echo "LICENSE and THIRD_PARTY.md present; THIRD_PARTY.md lists JUCE, VST3, HarfBuzz and SheenBidi."

      - name: Docs/Parameters.md matches Source/Core/Params.h
        shell: bash
        run: |
          python3 tools/gen_param_doc.py
          # the generator writes the platform's line endings; compare content only
          git diff --ignore-cr-at-eol --exit-code -- Docs/Parameters.md || {
            echo "::error::Docs/Parameters.md is stale: run 'python tools/gen_param_doc.py' and commit the result."
            exit 1
          }

  build:
    name: Windows x64 build, tests and unsigned ZIP
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      # keep presets, options and support files written by the tests out of the runner's Documents folder
      IFX_DATA_ROOT: ${{ github.workspace }}\ci-data
    steps:
      - uses: actions/checkout@v4

      # JUCE is not vendored. CMake looks for ./JUCE first (and would otherwise FetchContent the same
      # tag); a cached shallow clone of the pinned tag keeps every run on the identical sources.
      - name: Cache JUCE ${{ env.JUCE_TAG }}
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_TAG }}-windows-2022

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: git clone --depth 1 --branch $env:JUCE_TAG https://github.com/juce-framework/JUCE.git JUCE

      # warnings are errors in CI (JUCE recommended warning flags; CMake >= 3.24 is on the runner)
      - name: Configure (Visual Studio 2022, x64, warnings as errors)
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: DSP / state / render tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:IFX_DATA_ROOT | Out-Null
          & build\InterferenceTests_artefacts\Release\InterferenceTests.exe
          if ($LASTEXITCODE -ne 0) { throw "InterferenceTests failed (exit $LASTEXITCODE)" }

      - name: Host contract and GUI tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:IFX_DATA_ROOT | Out-Null
          & build\InterferenceGuiTests_artefacts\Release\InterferenceGuiTests.exe
          if ($LASTEXITCODE -ne 0) { throw "InterferenceGuiTests failed (exit $LASTEXITCODE)" }

      - name: Upload GUI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-snapshots
          path: build/InterferenceGuiTests_artefacts/Release/gui-snapshots/*.png
          if-no-files-found: ignore

      # the tested binaries, handed to the tag-only `release` job for signing (never re-built there)
      - name: Upload built binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-win64
          path: |
            build/Interference_artefacts/Release/VST3/
            build/Interference_artefacts/Release/Standalone/Interference.exe
          if-no-files-found: error

      # every CI build is unsigned; IFX_SIGNED_BY is left unset, so make_release.ps1 writes an UNSIGNED SIGNATURE.txt
      - name: Release ZIP + SHA-256 (unsigned)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools\make_release.ps1
          if ($LASTEXITCODE -ne 0) { throw "make_release.ps1 failed (exit $LASTEXITCODE)" }

      - name: Upload unsigned release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: interference-win64-unsigned
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Signed release ZIP (v* tags only)
    needs: [checks, build]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 30
    # protected environment: the signing secrets live here, behind the required reviewers
    environment: release
    steps:
      - uses: actions/checkout@v4

      # make_release.ps1 copies the third-party licence texts from the JUCE checkout
      - name: Cache JUCE ${{ env.JUCE_TAG }}
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_TAG }}-windows-2022

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: git clone --depth 1 --branch $env:JUCE_TAG https://github.com/juce-framework/JUCE.git JUCE

      - name: Download the tested binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-win64
          path: build/Interference_artefacts/Release

      # Signs with the release certificate from the protected environment. Without it the tag is packaged unsigned
      # and says so (notice + SIGNATURE.txt); a signature is never created or faked.
      - name: Sign binaries (only with a configured certificate)
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if (-not $env:SIGNING_CERT_BASE64) {
            Write-Host "::notice::No SIGNING_CERT_BASE64 secret in the 'release' environment: this tag is packaged UNSIGNED."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "interference-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          try {
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 ($pfx, $env:SIGNING_CERT_PASSWORD)
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                        Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found" }
            $art = "build\Interference_artefacts\Release"
            $files = @(Get-ChildItem -Recurse -File -Filter *.vst3 "$art\VST3\Interference.vst3") + @(Get-Item "$art\Standalone\Interference.exe")
            foreach ($f in $files) {
              $signArgs = @('sign', '/f', $pfx, '/fd', 'sha256', '/tr', 'http://timestamp.digicert.com', '/td', 'sha256')
              if ($env:SIGNING_CERT_PASSWORD) { $signArgs += @('/p', $env:SIGNING_CERT_PASSWORD) }
              & $signtool.FullName @signArgs $f.FullName
              if ($LASTEXITCODE -ne 0) { throw "signing failed: $($f.FullName)" }
              & $signtool.FullName verify /pa $f.FullName
              if ($LASTEXITCODE -ne 0) { throw "signature does not verify: $($f.FullName)" }
            }
            # only after every file signed and verified: make_release.ps1 writes this into SIGNATURE.txt
            "IFX_SIGNED_BY=$($cert.Subject)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfx
          }

      - name: Release ZIP + SHA-256
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools\make_release.ps1
          if ($LASTEXITCODE -ne 0) { throw "make_release.ps1 failed (exit $LASTEXITCODE)" }

      - name: Upload release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: interference-win64-release-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # ---- Linux and macOS: native build + tests + archive (every push) ----------------------------------------------
  build-unix:
    name: ${{ matrix.name }} build, tests and archive
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, plat: linux, os: ubuntu-22.04 }
          - { name: macOS universal, plat: macos, os: macos-14 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      IFX_DATA_ROOT: ${{ github.workspace }}/ci-data
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE ${{ env.JUCE_TAG }}
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_TAG }}-${{ matrix.os }}

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git JUCE

      - name: Linux dependencies
        if: matrix.plat == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: |
          extra=""
          if [ "${{ matrix.plat }}" = "macos" ]; then
            extra="-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15"
          fi
          # warnings-as-errors stays Windows-only: GCC/Clang -Wfloat-equal etc. in JUCE recommended flags are noisy
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $extra

      - name: Build Release
        run: cmake --build build --parallel

      - name: DSP / state / render tests
        run: |
          mkdir -p "$IFX_DATA_ROOT"
          ./build/InterferenceTests_artefacts/Release/InterferenceTests

      - name: Host contract and GUI tests
        run: |
          mkdir -p "$IFX_DATA_ROOT"
          if [ "${{ matrix.plat }}" = "linux" ]; then
            xvfb-run -a ./build/InterferenceGuiTests_artefacts/Release/InterferenceGuiTests
          else
            ./build/InterferenceGuiTests_artefacts/Release/InterferenceGuiTests
          fi

      - name: Ad-hoc sign (macOS; lets Apple Silicon load the bundles; not notarised)
        if: matrix.plat == 'macos'
        run: |
          for b in build/Interference_artefacts/Release/VST3/Interference.vst3 \
                   build/Interference_artefacts/Release/AU/Interference.component \
                   build/Interference_artefacts/Release/Standalone/Interference.app; do
            codesign --force --deep -s - "$b"
          done

      - name: Archive + SHA-256
        run: python3 tools/package_release.py ${{ matrix.plat }} build

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: interference-${{ matrix.plat }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  # ---- v* tags: one GitHub Release with the Windows, Linux and macOS archives ------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [release, build-unix]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: interference-*
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          n=$(ls assets | wc -l)
          [ "$n" -eq 6 ] || { echo "::error::expected 3 archives + 3 checksums, found $n files"; exit 1; }
          cat > notes.md <<'EOF'
          Interference for Windows x64, Linux x64 and macOS (universal arm64 + x86_64). Each archive holds the plug-in
          (VST3; AU on macOS), the stand-alone app, user documentation, third-party licence texts and a `SIGNATURE.txt`
          stating the signing status. Verify downloads with the matching `.sha256` file.

          Automated build, DSP/state/render tests and GUI/host-contract tests passed on every platform for this tag.
          Linux and macOS builds were exercised headlessly only; DAW loading, real-time host soak, sidechain behaviour
          in a host, empirical calibration, publisher licensing, code-signing and macOS notarisation remain unverified
          release gates (see `Docs/QA.md` in the archive). The macOS build is ad-hoc signed: on first launch right-click
          > Open, or run `xattr -dr com.apple.quarantine` on the bundle.
          EOF
          flags=""
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; flags="--verify-tag"; else flags="--target $GITHUB_SHA"; fi
          case "$tag" in *-alpha*|*-beta*|*-rc*) flags="$flags --prerelease";; esac
          gh release create "$tag" assets/* --title "Interference $tag" --notes-file notes.md $flags

  slow:
    name: Slow tests (CPU benchmark + 1 h offline soak)
    if: github.event_name == 'workflow_dispatch' && inputs.slow
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      IFX_DATA_ROOT: ${{ github.workspace }}\ci-data
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE ${{ env.JUCE_TAG }}
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: JUCE
          key: juce-${{ env.JUCE_TAG }}-windows-2022

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: git clone --depth 1 --branch $env:JUCE_TAG https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure and build the test binary
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build --config Release --parallel --target InterferenceTests
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: All tests including the slow ones
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:IFX_DATA_ROOT | Out-Null
          & build\InterferenceTests_artefacts\Release\InterferenceTests.exe --slow
          if ($LASTEXITCODE -ne 0) { throw "InterferenceTests --slow failed (exit $LASTEXITCODE)" }
